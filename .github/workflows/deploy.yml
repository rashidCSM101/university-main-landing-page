name: Auto Build & Deploy to Azure VPS

on:
  push:
    branches:
      - wethar-climate-dashbord
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy to Azure VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and Run Build & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '40.114.24.173' }}
          username: ${{ secrets.VPS_USERNAME || 'azureuser' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE || '' }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "🚀 [1/5] Starting Automated Deployment on VPS..."
            cd /var/www/lms

            echo "📥 [2/5] Pulling latest code for branch: ${{ github.ref_name }}..."
            git pull origin ${{ github.ref_name }}

            echo "📦 [3/5] Building Public Client frontend..."
            cd client
            npm install --prefer-offline --no-audit --silent
            npm run build
            cd ..

            echo "📦 [4/5] Building Admin Panel frontend..."
            cd admin
            npm install --prefer-offline --no-audit --silent
            npm run build
            cd ..

            echo "⚙️ [5/5] Building Backend Server & Reloading PM2..."
            cd server
            npm install --prefer-offline --no-audit --silent
            npm run build
            cd ..

            pm2 restart all
            pm2 status

            echo "🎉 Automated deployment finished successfully!"
